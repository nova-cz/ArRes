<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArRES · Prueba</title>
<style>
  :root { --rojo:#D4151C; --crema:#F9F0E1; --negro:#1B120B; --blanco:#FFFCF7; --gris:#8a7f74;
          --wa:#E7DDD0; --burbuja:#DCF8C6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--crema); color:var(--negro); }
  header { padding:14px 20px; background:var(--negro); color:var(--crema); display:flex; gap:12px; align-items:baseline; }
  header b { color:var(--rojo); font-size:20px; }
  main { display:grid; grid-template-columns: minmax(300px, 420px) 1fr; gap:20px; padding:20px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  .tarjeta { background:var(--blanco); border-radius:14px; box-shadow:0 2px 10px #0001; overflow:hidden; }
  .titulo { padding:12px 16px; font-weight:700; border-bottom:1px solid #0001; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .titulo input { width:150px; padding:6px 8px; border:1px solid #0002; border-radius:8px; }
  #chat { height:60vh; overflow-y:auto; padding:14px; background:var(--wa); display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:80%; padding:8px 11px; border-radius:10px; white-space:pre-wrap; line-height:1.35; font-size:15px; }
  .cliente { align-self:flex-end; background:var(--burbuja); }
  .agente { align-self:flex-start; background:#fff; }
  .escribiendo { color:var(--gris); font-style:italic; }
  form { display:flex; gap:8px; padding:10px; }
  form input { flex:1; padding:10px 12px; border-radius:20px; border:1px solid #0002; font-size:15px; }
  button { cursor:pointer; border:0; border-radius:20px; padding:9px 14px; font-weight:600; }
  .enviar { background:var(--rojo); color:#fff; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:10px 12px; border-bottom:1px solid #0001; vertical-align:top; }
  th { color:var(--gris); font-weight:600; }
  .estado { display:inline-block; padding:2px 9px; border-radius:20px; font-size:12px; font-weight:700; }
  .pendiente { background:#FFF1C2; } .escalada { background:#FFD9D9; color:var(--rojo); }
  .confirmada { background:#D7F5DC; } .rechazada { background:#eee; color:var(--gris); }
  .llego { background:#CFE8FF; } .no_llego { background:#eee; color:var(--rojo); }
  .tarde { outline:2px solid var(--rojo); }
  .si { background:#1f8a3a; color:#fff; } .no { background:#eee; }
  .vacio { padding:24px; color:var(--gris); }
  small { color:var(--gris); }
</style>
</head>
<body>
<header><b>ArRES.</b><span>Prueba local: chat tipo WhatsApp + panel del equipo</span></header>
<main>
  <section class="tarjeta">
    <div class="titulo">Cliente (WhatsApp simulado)
      <input id="tel" value="2221234567" aria-label="Teléfono del cliente">
    </div>
    <div id="chat"></div>
    <form id="form">
      <input id="texto" placeholder="Ej. ¿Tienen lugar el viernes a las 9 para 4?" autocomplete="off">
      <button class="enviar">Enviar</button>
    </form>
  </section>
  <section class="tarjeta">
    <div class="titulo">Panel del equipo · reservas <small>se actualiza solo</small></div>
    <div id="reservas"></div>
  </section>
</main>
<script>
const chat = document.getElementById('chat');
const tel = () => document.getElementById('tel').value;
let pintados = 0, ocupado = false;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function burbuja(rol, texto, clase = '') {
  const div = document.createElement('div');
  div.className = `msg ${rol} ${clase}`;
  div.textContent = texto;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function cargarMensajes() {
  if (ocupado) return;
  const r = await fetch(`/prueba/mensajes?telefono=${encodeURIComponent(tel())}`);
  const mensajes = await r.json();
  if (mensajes.length < pintados) { chat.innerHTML = ''; pintados = 0; }
  for (const m of mensajes.slice(pintados)) burbuja(m.rol, m.texto);
  pintados = mensajes.length;
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('texto');
  const texto = input.value.trim();
  if (!texto) return;
  input.value = '';
  ocupado = true;
  burbuja('cliente', texto);
  const espera = burbuja('agente', 'escribiendo…', 'escribiendo');
  try {
    const r = await fetch('/prueba/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ telefono: tel(), texto }) });
    const datos = await r.json();
    espera.remove();
    burbuja('agente', datos.respuesta || datos.detail || 'Error');
  } catch (err) { espera.textContent = 'Error: ' + err; }
  pintados += 2;
  ocupado = false;
  cargarReservas();
});

document.getElementById('tel').addEventListener('change', () => { chat.innerHTML = ''; pintados = 0; cargarMensajes(); });

async function decidir(id, estado) {
  await fetch(`/prueba/reservas/${id}`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ estado }) });
  cargarReservas(); cargarMensajes();
}

async function cargarReservas() {
  const r = await fetch('/prueba/reservas');
  const lista = await r.json();
  const caja = document.getElementById('reservas');
  if (!lista.length) { caja.innerHTML = '<div class="vacio">Aún no hay reservas. Pide una en el chat.</div>'; return; }
  const ALERTA_MIN = 10;
  caja.innerHTML = `<table><tr><th>Cliente</th><th>Cuándo</th><th>Personas</th><th>Estado</th><th></th></tr>${
    lista.map(x => {
      const espera = x.creado_en ? (Date.now() - new Date(x.creado_en)) / 60000 : 0;
      const tarde = ['pendiente','escalada'].includes(x.estado) && espera > ALERTA_MIN;
      const acciones = ['pendiente','escalada'].includes(x.estado)
        ? `<button class="si" onclick="decidir('${x.id}','confirmada')">Aprobar</button>
           <button class="no" onclick="decidir('${x.id}','rechazada')">Rechazar</button>`
        : x.estado === 'confirmada'
        ? `<button class="si" onclick="decidir('${x.id}','llego')">Llegó</button>
           <button class="no" onclick="decidir('${x.id}','no_llego')">No llegó</button>` : '';
      const extra = [x.motivo && `Motivo: ${esc(x.motivo)}`, x.notas && `Notas: ${esc(x.notas)}`].filter(Boolean).join('<br>');
      return `<tr><td>${esc(x.nombre)}<br><small>${esc(x.telefono)} · ${esc(x.canal)}</small></td>
        <td>${esc(x.cuando)}${extra ? `<br><small>${extra}</small>` : ''}</td><td>${x.personas}</td>
        <td><span class="estado ${x.estado} ${tarde ? 'tarde' : ''}">${x.estado}${tarde ? ' · sin aprobar' : ''}</span></td>
        <td>${acciones}</td></tr>`;
    }).join('')}</table>`;
}

cargarMensajes(); cargarReservas();
setInterval(() => { cargarMensajes(); cargarReservas(); }, 2000);
</script>
</body>
</html>
